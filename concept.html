<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept · A Dictionary Of Green</title>
<link href="https://fonts.googleapis.com/css2?family=Rock+3D&family=Sarala:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#111; --g:#1f7a4d; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:#F5F1E8; color:var(--ink); font-family:"Sarala", sans-serif; font-weight:400; font-style:normal; }

  .rock { font-family:"Rock 3D", system-ui; font-weight:400; font-style:normal; }
  header { position:absolute; top:0; left:0; right:0; z-index:2; display:flex; justify-content:flex-end; align-items:center; padding:5vh 6vw 0; }
  .brand { color:var(--ink); text-decoration:none; font-size:clamp(20px, 2.2vw, 32px); }
  nav { display:flex; gap:3vw; font-size:clamp(17px, 1.6vw, 24px); }
  nav a { color:var(--ink); text-decoration:none; transition:color .2s; }
  nav a:hover { color:var(--g); }

  .hero { position:relative; z-index:1; height:100vh; height:100svh; overflow:hidden; }
  #big { position:absolute; width:1px; height:1px; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  #cv { position:absolute; inset:0; width:100%; height:100%; display:block; }

</style>
<link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
<header>
  <nav><a href="index.html">Home</a><a href="game.html">Game</a><a href="text.html">Text</a></nav>
</header>

<section class="hero">
  <h1 id="big" class="rock">GREEN</h1>
  <canvas id="cv" aria-hidden="true"></canvas>
</section>

<script>
  /* GREEN 上下左右都铺满屏幕：用 canvas 量出字母的真实边界，再拉伸到整个屏幕 */
  const cv = document.getElementById('cv');
  function draw() {
    const W = cv.clientWidth, H = cv.clientHeight, dpr = window.devicePixelRatio || 1;
    cv.width = W * dpr; cv.height = H * dpr;
    const ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.font = '400 200px "Rock 3D", system-ui';
    ctx.textBaseline = 'alphabetic';
    const m = ctx.measureText('GREEN');
    const left = m.actualBoundingBoxLeft, right = m.actualBoundingBoxRight;
    const asc = m.actualBoundingBoxAscent, desc = m.actualBoundingBoxDescent;
    const sx = W / (left + right), sy = H / (asc + desc);
    ctx.fillStyle = '#2fa84f';
    ctx.setTransform(dpr * sx, 0, 0, dpr * sy, 0, 0);
    ctx.fillText('GREEN', left, asc);
  }
  draw();
  addEventListener('resize', draw);
  if (document.fonts) document.fonts.load('200px "Rock 3D"').then(draw);
</script>
</body>
</html>
