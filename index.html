<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Dictionary Of Green</title>
<link href="https://fonts.googleapis.com/css2?family=Aleo:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root { --green:#6cff3f; --bg:#000; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); }
  body { font-family:'Aleo', Georgia, serif; color:#fff; overflow:hidden; }

  .hero { position:relative; width:100%; height:100vh; overflow:hidden; }

  nav { position:absolute; top:20px; right:24px; display:flex; gap:12vw; font-weight:300; font-size:clamp(16px,1.7vw,24px); }
  nav a { color:#ddd; text-decoration:none; transition:color .2s; }
  nav a:hover { color:var(--green); }

  .title { position:absolute; left:2vw; top:12vh; margin:0; line-height:1; }
  .title .small { display:block; font-weight:300; font-size:clamp(32px,4.4vw,64px); }
  .title .big { display:block; font-weight:700; color:var(--green); font-size:clamp(48px,6.4vw,92px); letter-spacing:.01em; margin-top:.05em; }

  .hint { position:absolute; right:1vw; top:30vh; margin:0; color:var(--green); font-weight:300; font-size:clamp(15px,1.6vw,22px); }

  .stage { position:absolute; left:50%; top:62vh; width:0; height:0; }
  .card {
    position:absolute; left:0; top:0;
    width:var(--size); height:var(--size);
    margin:calc(var(--size) / -2) 0 0 calc(var(--size) / -2);
    background-size:cover; background-position:center;
    transform:translate(var(--x), var(--y)) rotate(var(--r)) scale(var(--s, 1));
    transition:transform .45s cubic-bezier(.2,.8,.2,1);
    cursor:pointer; will-change:transform;
    z-index:var(--z);
  }
  .card:hover { --s:1.45; z-index:999; }
</style>
</head>
<body>
<section class="hero">
  <nav><a href="game.html">Game</a><a href="concept.html">Concept</a></nav>

  <h1 class="title">
    <span class="small">A Dictionary Of</span>
    <span class="big">GREEN</span>
  </h1>
  <p class="hint">Pick one you interested in</p>

  <div class="stage" id="stage"></div>
</section>

<script src="data.js"></script>
<script>
  /* ====== 弧形参数（想调形状就改这里）====== */
  const COUNT = ITEMS.length;  // 卡片数量（来自 data.js）
  const STEP  = 5;             // 相邻卡片的角度差（度）：越大弧越弯

  const stage = document.getElementById('stage');
  const mid = (COUNT - 1) / 2;
  const cards = [];

  for (let i = 0; i < COUNT; i++) {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = `detail.html?id=${i}`;          // 点击后跳到详情页
    a.style.backgroundColor = ITEMS[i].color;
    stage.appendChild(a);
    cards.push(a);
  }

  function layout() {
    const w = innerWidth;
    const size = Math.max(110, Math.min(w * 0.2, 280));   // 卡片边长
    const R = Math.max(w * 0.62, 360);                    // 弧半径
    cards.forEach((el, i) => {
      const t = i - mid;
      const th = t * STEP * Math.PI / 180;
      el.style.setProperty('--size', size + 'px');
      el.style.setProperty('--x', (R * Math.sin(th)).toFixed(1) + 'px');
      el.style.setProperty('--y', (R * (1 - Math.cos(th))).toFixed(1) + 'px');
      el.style.setProperty('--r', (t * STEP).toFixed(1) + 'deg');
      el.style.setProperty('--z', 100 - Math.round(Math.abs(t) * 3));
    });
  }
  layout();
  addEventListener('resize', layout);
</script>
</body>
</html>
