<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="favicon.png">
<title>A Dictionary Of Green</title>
<link href="https://fonts.googleapis.com/css2?family=Rock+3D&family=Sarala:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#111; --cw:clamp(110px, 11vw, 190px); }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:#F5F1E8; color:var(--ink); overflow:hidden; }

  .rock   { font-family:"Rock 3D", system-ui; font-weight:400; font-style:normal; }
  .school { font-family:"Sarala", sans-serif; font-weight:400; font-style:normal; }

  .page { position:relative; height:100vh; display:flex; flex-direction:column; }

  header { display:flex; justify-content:space-between; align-items:center; padding:5vh 6vw 0; }
  .brand { color:var(--ink); text-decoration:none; font-size:clamp(20px, 2.2vw, 32px); }
  nav { display:flex; gap:3vw; font-size:clamp(17px, 1.6vw, 24px); }
  nav a { color:var(--ink); text-decoration:none; transition:color .2s; }
  nav a:hover { color:#1f7a4d; }

  h1 { margin:9vh 6vw 0; font-size:clamp(36px, 6vw, 92px); line-height:1.05; }

  /* 可拖动的一排卡片 */
  .track { position:relative; display:flex; align-items:flex-end; margin-top:auto; padding:5vh 6vw 2vh; overflow-x:auto; scrollbar-width:none; cursor:grab; }
  .track::-webkit-scrollbar { display:none; }
  .track.grabbing { cursor:grabbing; }

  .card {
    position:relative; flex:0 0 var(--cw); height:calc(var(--cw) * 2.1 + var(--h, 0px)); margin-right:calc(var(--cw) * -.06);
    padding:14px 16px; font-family:"Sarala", sans-serif; font-size:20px; text-decoration:none;
    box-shadow:0 6px 14px rgba(0,0,0,.12); user-select:none; -webkit-user-drag:none;
    transform:rotate(var(--r)); transform-origin:50% 100%; transition:transform .35s cubic-bezier(.2,.8,.2,1);
  }
  .card:hover  { transform:translateY(-1.5vh) rotate(var(--r)); z-index:4; }
  .card.active { transform:translateY(-3vh) rotate(var(--r)); z-index:5; }

  footer { margin-top:auto; padding:0 6vw 5vh; display:flex; justify-content:flex-end; align-items:center; font-size:clamp(16px, 1.5vw, 22px); }
  .arrows button { background:none; border:0; font:200 clamp(28px, 3vw, 44px) system-ui; color:var(--ink); cursor:pointer; padding:0 .4em; }
  .arrows button:hover { color:#1f7a4d; }
</style>
</head>
<body>

<div class="page">
  <header>
    <a class="brand rock" href="index.html">A Dictionary of Green</a>
    <nav class="school"><a href="game.html">Game</a><a href="concept.html">Concept</a><a href="text.html">Text</a></nav>
  </header>

  <h1 class="rock">Pick one you interested in</h1>

  <div class="track" id="track"></div>

</div>

<script src="data.js"></script>
<script>
  /* 调试用：脚本出错时把原因显示在左上角，调好后可以删掉这一行 */
  addEventListener('error', e => document.body.insertAdjacentHTML('afterbegin', '<pre style="position:fixed;top:8px;left:8px;color:#c00;z-index:9">' + e.message + '</pre>'));

  const track = document.getElementById('track');
  const lum  = hex => { const v = [1,3,5].map(i => parseInt(hex.substr(i, 2), 16) / 255); return .2126*v[0] + .7152*v[1] + .0722*v[2]; };
  const rnd  = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };   // 固定的"随机"，每次刷新一样

  /* 每条数据做一张卡片：颜色来自 data.js，轻微的旋转和高低错位 */
  const cards = ITEMS.map((it, i) => {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = 'detail.html?id=' + i;
    a.draggable = false;
    a.style.background = it.color;
    a.style.color = lum(it.color) < .45 ? '#fff' : '#111';
    a.style.setProperty('--r', ((rnd(i) - .5) * 3).toFixed(2) + 'deg');
    a.style.setProperty('--h', (rnd(i + 50) * 28).toFixed(0) + 'px');   // 高度随机，底部齐平
    a.textContent = String(i + 1).padStart(2, '0');
    track.appendChild(a);
    return a;
  });

  /* 离中间最近的那张卡片抬起来 */
  function mark() {
    const mid = track.scrollLeft + track.clientWidth / 2;
    let best = null, bd = Infinity;
    cards.forEach(c => { const d = Math.abs(c.offsetLeft + c.offsetWidth / 2 - mid); if (d < bd) { bd = d; best = c; } });
    cards.forEach(c => c.classList.toggle('active', c === best));
  }

  /* 鼠标拖动（触屏直接用手指滑动） */
  let down = false, moved = false, sx = 0, sl = 0;
  track.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') return; down = true; moved = false; sx = e.clientX; sl = track.scrollLeft; track.classList.add('grabbing'); });
  addEventListener('pointermove', e => { if (!down) return; const dx = e.clientX - sx; if (Math.abs(dx) > 5) moved = true; track.scrollLeft = sl - dx; });
  addEventListener('pointerup', () => { down = false; track.classList.remove('grabbing'); });
  track.addEventListener('click', e => { if (moved) { e.preventDefault(); moved = false; } }, true);   // 拖动时不触发跳转

  /* 左右箭头 */

  /* 一开始让第 6 张在正中间 */
  const c0 = cards[5] || cards[0];
  track.scrollLeft = c0.offsetLeft - (track.clientWidth - c0.offsetWidth) / 2;
  // 刚打开时不抬起任何一张；用户开始拖动/滚动后，才抬起经过中间的那张
  setTimeout(() => track.addEventListener('scroll', mark, { passive:true }), 300);
</script>
</body>
</html>
