<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game · A Dictionary Of Green</title>
<link href="https://fonts.googleapis.com/css2?family=Aleo:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root { --w: min(71vw, 720px); }   /* 色块列的宽度，想调就改这里 */
  html, body { margin:0; background:#f4f4f4; font-family:'Aleo', Georgia, serif; }

  .col { width:var(--w); margin:24px auto 0; }
  .block { position:relative; width:100%; height:calc(var(--w) * .625); }

  /* 色块上的黑色粗体小字：大小和边距都跟着列宽走 */
  .msg { position:absolute; bottom:calc(var(--w) * .034); color:#000; font-weight:700; font-size:calc(var(--w) * .082); line-height:1; white-space:nowrap; }
  .msg.left  { left:calc(var(--w) * .03); }
  .msg.right { right:calc(var(--w) * .03); }
  .msg.arrow { right:calc(var(--w) * .03); bottom:calc(var(--w) * .015); font-weight:300; font-size:calc(var(--w) * .15); }

  /* 返回主页（设计稿里没有，不需要就删掉这段和下面的 <a>） */
  .back { position:fixed; left:16px; top:14px; font-size:15px; font-weight:300; color:#000; opacity:.4; text-decoration:none; z-index:5; }
  .back:hover { opacity:1; }
</style>
</head>
<body>
<a class="back" href="index.html">← Back</a>
<div class="col" id="col"></div>

<script>
  /* 调试用：脚本出错时把原因显示在左上角，调好后可以删掉这一行 */
  addEventListener('error', e => document.body.insertAdjacentHTML('afterbegin', '<pre style="position:fixed;top:40px;left:16px;color:#c00;z-index:9">' + e.message + '</pre>'));

  /* 前 11 块用设计稿里的颜色，之后随机生成不同的绿色 */
  const SEED = ['#78FF50','#CCFF4F','#A8C956','#68C650','#72C487','#BDEED7','#A3AD8C','#82822A','#468A3A','#1F4A42','#5DA05A'];

  /* 哪一块上放什么字（序号从 0 开始） */
  const MSG = {
    0: { text:'↓',            cls:'arrow' },
    2: { text:'Scroll down.', cls:'left'  },
    4: { text:'Keep going.',  cls:'right' },
    7: { text:'Don’t stop.',  cls:'left'  },
  };

  function randomGreen() {
    const h = 70 + Math.random() * 95;    // 色相：黄绿 → 青绿
    const s = 25 + Math.random() * 75;    // 饱和度
    const l = 18 + Math.random() * 68;    // 明度：深到浅
    return 'hsl(' + (h | 0) + ', ' + (s | 0) + '%, ' + (l | 0) + '%)';
  }

  const col = document.getElementById('col');
  let n = 0;

  function addBlocks(count) {
    for (let k = 0; k < count; k++, n++) {
      const b = document.createElement('div');
      b.className = 'block';
      b.style.background = n < SEED.length ? SEED[n] : randomGreen();
      if (MSG[n]) {
        const s = document.createElement('span');
        s.className = 'msg ' + MSG[n].cls;
        s.textContent = MSG[n].text;
        b.appendChild(s);
      }
      col.appendChild(b);
    }
  }

  /* 快滑到底部时就继续生成，永远滑不完（guard 防止出错时死循环） */
  function fill() {
    let guard = 0;
    while (guard++ < 40 && document.documentElement.scrollHeight - scrollY - innerHeight < 1500) addBlocks(4);
  }
  fill();
  addEventListener('scroll', fill, { passive:true });
  addEventListener('resize', fill);
</script>
</body>
</html>
